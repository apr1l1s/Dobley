name: Проверка проекта
run-name: Проверка Dobley для ${{ github.ref_name }} / ${{ github.event.inputs.reason || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Причина ручного запуска
        required: false
        default: Ручная проверка проекта
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  dotnet:
    name: Сборка, тесты и миграции
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Включить кеш NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Восстановить NuGet-пакеты
        run: dotnet restore Dobley.sln

      - name: Собрать решение
        run: dotnet build Dobley.sln --configuration Release --no-restore

      - name: Запустить тесты
        run: dotnet test Dobley.sln --configuration Release --no-build

      - name: Установить EF Core tools
        run: dotnet tool install dotnet-ef --version 9.0.16 --tool-path .tools

      - name: Сгенерировать SQL-скрипт миграций
        run: |
          mkdir -p artifacts
          .tools/dotnet-ef migrations script \
            --idempotent \
            --configuration Release \
            --no-build \
            --project Dobley.Data.Core \
            --startup-project Dobley.Data.Core \
            --output artifacts/migrations.sql

      - name: Сохранить SQL-скрипт миграций
        uses: actions/upload-artifact@v4
        with:
          name: migrations.sql
          path: artifacts/migrations.sql

      - name: Записать краткий отчёт
        run: |
          {
            echo "## Проверка проекта"
            echo ""
            echo "- Ветка: \`${{ github.ref_name }}\`"
            echo "- Коммит: \`${{ github.sha }}\`"
            echo "- Причина запуска: \`${{ github.event.inputs.reason || github.event_name }}\`"
            echo "- Сборка: Release"
            echo "- Тесты: выполнены"
            echo "- Миграции: SQL-скрипт сохранён в artifact \`migrations.sql\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker-сборка ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            title: API
            dockerfile: Dobley.Endpoints.Api/Dockerfile
          - name: auth
            title: Auth
            dockerfile: Dobley.Endpoints.Auth/Dockerfile
          - name: gateway
            title: Gateway
            dockerfile: Dobley.Endpoints.Gateway/Dockerfile
          - name: ui
            title: UI
            dockerfile: Dobley.Endpoints.Ui/Dockerfile
          - name: notifications
            title: Notifications
            dockerfile: Dobley.Workers.Notifications/Dockerfile

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Проверить compose.yaml
        run: docker compose -f compose.yaml config --quiet

      - name: Собрать Docker image ${{ matrix.title }}
        run: docker build --build-arg BUILD_CONFIGURATION=Release --file ${{ matrix.dockerfile }} --tag dobley.${{ matrix.name }}:ci .

      - name: Записать краткий отчёт
        run: |
          {
            echo "## Docker-сборка ${{ matrix.title }}"
            echo ""
            echo "- Dockerfile: \`${{ matrix.dockerfile }}\`"
            echo "- Image: \`dobley.${{ matrix.name }}:ci\`"
            echo "- Compose-файл: проверен"
          } >> "$GITHUB_STEP_SUMMARY"

  repository-hygiene:
    name: Чистота репозитория
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Проверить, что Telegram token не закоммичен
        run: |
          if grep -RInE 'TELEGRAM_BOT_TOKEN=[0-9]{8,}:[A-Za-z0-9_-]{25,}|[0-9]{8,}:[A-Za-z0-9_-]{25,}' \
            --exclude-dir=.git \
            --exclude-dir=bin \
            --exclude-dir=obj \
            --exclude='.github/workflows/ci.yml' \
            .; then
            echo "::error::В репозитории найден похожий на Telegram token секрет."
            exit 1
          fi

      - name: Записать краткий отчёт
        run: |
          {
            echo "## Чистота репозитория"
            echo ""
            echo "- Telegram token: не найден"
            echo "- Проверены исходники без \`.git\`, \`bin\` и \`obj\`"
          } >> "$GITHUB_STEP_SUMMARY"
