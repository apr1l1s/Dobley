name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Dobley.sln

      - name: Build
        run: dotnet build Dobley.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Dobley.sln --configuration Release --no-build

      - name: Install EF tools
        run: dotnet tool install dotnet-ef --version 9.0.16 --tool-path .tools

      - name: Generate migration script
        run: |
          mkdir -p artifacts
          .tools/dotnet-ef migrations script \
            --idempotent \
            --configuration Release \
            --no-build \
            --project Dobley.Data.Core \
            --startup-project Dobley.Data.Core \
            --output artifacts/migrations.sql

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: migrations.sql
          path: artifacts/migrations.sql

  docker:
    name: Docker validation
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dobley.Endpoints.Api/Dockerfile
          - name: auth
            dockerfile: Dobley.Endpoints.Auth/Dockerfile
          - name: gateway
            dockerfile: Dobley.Endpoints.Gateway/Dockerfile
          - name: ui
            dockerfile: Dobley.Endpoints.Ui/Dockerfile
          - name: notifications
            dockerfile: Dobley.Workers.Notifications/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f compose.yaml config --quiet

      - name: Build ${{ matrix.name }} image
        run: docker build --file ${{ matrix.dockerfile }} --tag dobley.${{ matrix.name }}:ci .

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Telegram token is not committed
        run: |
          if grep -RInE 'TELEGRAM_BOT_TOKEN=[0-9]{8,}:[A-Za-z0-9_-]{25,}|[0-9]{8,}:[A-Za-z0-9_-]{25,}' \
            --exclude-dir=.git \
            --exclude-dir=bin \
            --exclude-dir=obj \
            --exclude='.github/workflows/ci.yml' \
            .; then
            echo "::error::В репозитории найден похожий на Telegram token секрет."
            exit 1
          fi
