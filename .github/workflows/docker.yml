name: Docker images

on:
  push:
    branches:
      - master

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dobley.Endpoints.Api/Dockerfile
            image: dobley.endpoints.api
          - name: auth
            dockerfile: Dobley.Endpoints.Auth/Dockerfile
            image: dobley.endpoints.auth
          - name: gateway
            dockerfile: Dobley.Endpoints.Gateway/Dockerfile
            image: dobley.endpoints.gateway
          - name: ui
            dockerfile: Dobley.Endpoints.Ui/Dockerfile
            image: dobley.endpoints.ui
          - name: notifications
            dockerfile: Dobley.Workers.Notifications/Dockerfile
            image: dobley.workers.notifications

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
