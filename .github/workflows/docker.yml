name: Публикация Docker images
run-name: Публикация Docker images для ${{ github.ref_name }} / ${{ github.event.inputs.reason || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Причина ручной публикации
        required: false
        default: Ручная публикация Docker images
  push:
    branches:
      - master

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Опубликовать ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            title: API
            dockerfile: Dobley.Endpoints.Api/Dockerfile
            image: dobley.endpoints.api
          - name: auth
            title: Auth
            dockerfile: Dobley.Endpoints.Auth/Dockerfile
            image: dobley.endpoints.auth
          - name: gateway
            title: Gateway
            dockerfile: Dobley.Endpoints.Gateway/Dockerfile
            image: dobley.endpoints.gateway
          - name: ui
            title: UI
            dockerfile: Dobley.Endpoints.Ui/Dockerfile
            image: dobley.endpoints.ui
          - name: notifications
            title: Notifications
            dockerfile: Dobley.Workers.Notifications/Dockerfile
            image: dobley.workers.notifications

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовить Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Собрать и опубликовать image ${{ matrix.title }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            BUILD_CONFIGURATION=Release
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}

      - name: Записать краткий отчёт
        run: |
          {
            echo "## Опубликован image ${{ matrix.title }}"
            echo ""
            echo "- Dockerfile: \`${{ matrix.dockerfile }}\`"
            echo "- Registry: \`${{ env.REGISTRY }}\`"
            echo "- latest: \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest\`"
            echo "- sha: \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
