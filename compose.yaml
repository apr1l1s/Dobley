services:
  dobley.gateway:
    image: dobley.endpoints.gateway
    container_name: dobley.gateway
    build:
      context: .
      dockerfile: Dobley.Endpoints.Gateway/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 5000
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://dobley.otel-collector:4317}
      LOG_FILE_PATH: /app/logs/gateway.log
      DATA_PROTECTION_KEYS_PATH: /app/data-protection-keys
    networks:
      - dobley-network
    volumes:
      - dobley_gateway_logs:/app/logs
      - dobley_gateway_data_protection_keys:/app/data-protection-keys
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      dobley.api:
        condition: service_healthy
      dobley.auth:
        condition: service_healthy
      dobley.ui:
        condition: service_healthy
    restart: always

  dobley.ui:
    image: dobley.endpoints.ui
    container_name: dobley.ui
    build:
      context: .
      dockerfile: Dobley.Endpoints.Ui/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 5003
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://dobley.otel-collector:4317}
      LOG_FILE_PATH: /app/logs/ui.log
      DATA_PROTECTION_KEYS_PATH: /app/data-protection-keys
    networks:
      - dobley-network
    volumes:
      - dobley_ui_logs:/app/logs
      - dobley_ui_data_protection_keys:/app/data-protection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: always

  dobley.api:
    image: dobley.endpoints.api
    container_name: dobley.api
    build:
      context: .
      dockerfile: Dobley.Endpoints.Api/Dockerfile
    environment:
      DB_HOST: dobley.postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: postgres
      SECRET_KEY: ${SECRET_KEY:-ThisIsAVeryLongSecretKeyThatIsAtLeast32BytesLong}
      JWT_ISSUER: ${JWT_ISSUER:-apr1l1s_auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-apr1l1s_services}
      SEED_DEV_DATA: ${SEED_DEV_DATA:-false}
      REDIS_CONNECTION: ${REDIS_CONNECTION:-dobley.redis:6379}
      ASPNETCORE_HTTP_PORTS: 5001
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://dobley.otel-collector:4317}
      LOG_FILE_PATH: /app/logs/api.log
      DATA_PROTECTION_KEYS_PATH: /app/data-protection-keys
    networks:
      - dobley-network
    volumes:
      - dobley_api_logs:/app/logs
      - dobley_api_data_protection_keys:/app/data-protection-keys
    depends_on:
      dobley.postgres:
        condition: service_healthy
      dobley.redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always

  dobley.auth:
    image: dobley.endpoints.auth
    container_name: dobley.auth
    build:
      context: .
      dockerfile: Dobley.Endpoints.Auth/Dockerfile
    environment:
      DB_HOST: dobley.postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: postgres
      SECRET_KEY: ${SECRET_KEY:-ThisIsAVeryLongSecretKeyThatIsAtLeast32BytesLong}
      JWT_ISSUER: ${JWT_ISSUER:-apr1l1s_auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-apr1l1s_services}
      SEED_DEV_DATA: ${SEED_DEV_DATA:-false}
      REDIS_CONNECTION: ${REDIS_CONNECTION:-dobley.redis:6379}
      ASPNETCORE_HTTP_PORTS: 5002
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://dobley.otel-collector:4317}
      LOG_FILE_PATH: /app/logs/auth.log
      DATA_PROTECTION_KEYS_PATH: /app/data-protection-keys
    networks:
      - dobley-network
    volumes:
      - dobley_auth_logs:/app/logs
      - dobley_auth_data_protection_keys:/app/data-protection-keys
    depends_on:
      dobley.postgres:
        condition: service_healthy
      dobley.redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always

  dobley.notifications:
    image: dobley.workers.notifications
    container_name: dobley.notifications
    build:
      context: .
      dockerfile: Dobley.Workers.Notifications/Dockerfile
    environment:
      DB_HOST: dobley.postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: postgres
      REDIS_CONNECTION: ${REDIS_CONNECTION:-dobley.redis:6379}
      RABBITMQ_HOST: dobley.rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBITMQ_NOTIFICATION_QUEUE: ${RABBITMQ_NOTIFICATION_QUEUE:-dobley.notifications}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DEFAULT_NOTIFY_BEFORE_DAYS: ${DEFAULT_NOTIFY_BEFORE_DAYS:-3}
      EXPIRATION_WATCH_INTERVAL_SECONDS: ${EXPIRATION_WATCH_INTERVAL_SECONDS:-30}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://dobley.otel-collector:4317}
      LOG_FILE_PATH: /app/logs/notifications.log
      DATA_PROTECTION_KEYS_PATH: /app/data-protection-keys
    networks:
      - dobley-network
    volumes:
      - dobley_notifications_logs:/app/logs
      - dobley_notifications_data_protection_keys:/app/data-protection-keys
    depends_on:
      dobley.postgres:
        condition: service_healthy
      dobley.rabbitmq:
        condition: service_healthy
    restart: always

  dobley.redis:
    image: redis:7-alpine
    container_name: dobley.redis
    networks:
      - dobley-network
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  dobley.rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dobley.rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    networks:
      - dobley-network
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always

  dobley.elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: dobley.elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    networks:
      - dobley-network
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - dobley_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

  dobley.otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    container_name: dobley.otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    networks:
      - dobley-network
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      dobley.elasticsearch:
        condition: service_healthy
    restart: always

  dobley.grafana:
    image: grafana/grafana:11.3.0
    container_name: dobley.grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_LANGUAGE: ru-RU
    networks:
      - dobley-network
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - dobley_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      dobley.elasticsearch:
        condition: service_healthy
    restart: always

  dobley.postgres:
    image: postgres:17-alpine
    container_name: dobley.postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: postgres
    volumes:
      - dobley_postgres_data:/var/lib/postgresql/data
    networks:
      - dobley-network
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

networks:
  dobley-network:
    driver: bridge

volumes:
  dobley_postgres_data:
    name: dobley_postgres_data
    driver: local
  dobley_elasticsearch_data:
    name: dobley_elasticsearch_data
    driver: local
  dobley_grafana_data:
    name: dobley_grafana_data
    driver: local
  dobley_gateway_logs:
    name: dobley_gateway_logs
    driver: local
  dobley_api_logs:
    name: dobley_api_logs
    driver: local
  dobley_auth_logs:
    name: dobley_auth_logs
    driver: local
  dobley_notifications_logs:
    name: dobley_notifications_logs
    driver: local
  dobley_ui_logs:
    name: dobley_ui_logs
    driver: local
  dobley_gateway_data_protection_keys:
    name: dobley_gateway_data_protection_keys
    driver: local
  dobley_api_data_protection_keys:
    name: dobley_api_data_protection_keys
    driver: local
  dobley_auth_data_protection_keys:
    name: dobley_auth_data_protection_keys
    driver: local
  dobley_notifications_data_protection_keys:
    name: dobley_notifications_data_protection_keys
    driver: local
  dobley_ui_data_protection_keys:
    name: dobley_ui_data_protection_keys
    driver: local
