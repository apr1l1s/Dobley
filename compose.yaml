services:
  dobley.endpoints.api:
    image: dobley.endpoints.api
    container_name: dobley.endpoints.api
    build:
      context: .
      dockerfile: Dobley.Endpoints.Api/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: postgres
      SECRET_KEY: ${SECRET_KEY:-ThisIsAVeryLongSecretKeyThatIsAtLeast32BytesLong}
      ASPNETCORE_URLS: "http://0.0.0.0:${API_PORT:-5001}"
    networks:
      - dobley-network
    ports:
      - "${API_PORT:-5001}:${API_PORT:-5001}"
    depends_on:
      dobley.endpoints.auth:
        condition: service_started
      dobley.databases.base:
        condition: service_healthy

  dobley.endpoints.auth:
    image: dobley.endpoints.auth
    container_name: dobley.endpoints.auth
    build:
      context: .
      dockerfile: Dobley.Endpoints.Auth/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_NAME: postgres
      SECRET_KEY: ${SECRET_KEY:-ThisIsAVeryLongSecretKeyThatIsAtLeast32BytesLong}
      ASPNETCORE_URLS: "http://0.0.0.0:${AUTH_PORT:-5002}"
    networks:
      - dobley-network
    ports:
      - "${AUTH_PORT:-5002}:${AUTH_PORT:-5002}"
    depends_on:
      dobley.databases.base:
        condition: service_healthy

  dobley.databases.base:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: postgres
    volumes:
      - dobley_databases_volume:/var/lib/postgresql/data
    networks:
      - dobley-network
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

networks:
  dobley-network:
    driver: bridge

volumes:
  dobley_databases_volume:
    name: dobley_databases_volume
    driver: local
